<title>בואו נלמד אקורדים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800&display=swap">
<style>
  /* Layout: one centered card on white; logo on top, a stacked three-note chord on a staff as the hero, then one big play button. Single light look on purpose: the logo is drawn for white. */
  :root {
    --bg: #ffffff;
    --ink: #43225A;
    --muted: #8a8590;
    --line: #d9d6dd;
    --do: #CC3717;
    --mi: #F2A412;
    --sol: #3B6BB2;
    --go: #189E8A;
    --display: "Rubik", "Arial Hebrew", Arial, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--display);
    direction: rtl;
  }
  .page {
    min-height: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(18px, 4vh, 36px);
    padding-block: 24px 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    text-align: center;
  }
  .logo { width: min(260px, 62vw); height: auto; display: block; }
  h1 {
    margin: 0;
    font-weight: 800;
    font-size: clamp(2rem, 8vw, 3.4rem);
    line-height: 1.1;
    text-wrap: balance;
  }
  .staff { width: min(340px, 86vw); height: auto; display: block; overflow: visible; }
  .staff .n { transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; }
  .staff .n2 { animation-delay: .15s; }
  .staff .n3 { animation-delay: .3s; }
  @keyframes pop { from { transform: scale(.4); } to { transform: scale(1); } }

  .play {
    display: inline-flex;
    align-items: center;
    gap: 18px;
    padding: 14px 18px 14px 40px;
    border-radius: 999px;
    background: var(--go);
    color: #fff;
    text-decoration: none;
    font-weight: 800;
    font-size: clamp(1.6rem, 6vw, 2.2rem);
    box-shadow: 0 6px 0 color-mix(in srgb, #189E8A 62%, #000), 0 14px 28px rgba(24,158,138,.28);
    transition: transform .12s ease, box-shadow .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .play:hover { transform: translateY(-2px); box-shadow: 0 8px 0 color-mix(in srgb, #189E8A 62%, #000), 0 18px 32px rgba(24,158,138,.32); }
  .play:active { transform: translateY(5px); box-shadow: 0 1px 0 color-mix(in srgb, #189E8A 62%, #000), 0 6px 14px rgba(24,158,138,.25); }
  .play:focus-visible { outline: 4px solid var(--mi); outline-offset: 5px; }
  .play svg { width: 1.9em; height: 1.9em; flex: none; }

  @media (prefers-reduced-motion: reduce) {
    .staff .n { animation: none; }
    .play { transition: none; }
  }
</style>

</head>
